<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI generated Daily Affirmations</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to Daily Affirmations</h1>
      </header>

      <main>
        <small
          >How do you feel and what would you like to focus on today? Happy,
          positive, motivated?</small
        >
        <br />
        <form id="affirmation-form">
          <input
            type="text"
            placeholder="Enter how you feel for your affirmation today"
            autofocus
            required
            autocomplete="off"
            class="affirmation-prompt"
            id="affirmation-instructions"
          />
          <input class="affirmation-submit" type="submit" value="Submit" />
        </form>

        <br />
        <div class="affirmation-output hidden" id="affirmation-output"></div>
        <br />
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/debbih" target="_blank">Debbie Hunter</a>
        and is
        <a href="https://github.com/debbih/daily-affirmations" target="_blank"
          >open sourced on GitHub</a
        >
        and is
        <a href="https://debsdailyaffirmation.netlify.app/" target="_blank"
          >hosted on Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
